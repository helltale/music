name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend build
        working-directory: frontend
        run: npm ci && npm run build

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum
      - name: unit tests
        working-directory: backend
        run: go test ./internal/platform/ ./internal/catalog/provider/ -count=1

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: postgres and minio
        run: |
          docker compose --project-directory . -f deploy/compose/docker-compose.yml up -d --wait postgres minio
          docker compose --project-directory . -f deploy/compose/docker-compose.yml run --rm --no-deps minio-init
      - name: integration tests
        working-directory: backend
        run: |
          go test ./internal/catalog/ -count=1 -timeout 10m
          go test ./internal/importjob/ -count=1 -timeout 10m
          go test ./internal/audio/ -count=1 -timeout 10m
          go test ./internal/streaming/ -count=1 -timeout 10m

  images:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build once and tag git sha
        env:
          PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: ./deploy/ci/build-images.sh >> "$GITHUB_STEP_SUMMARY"
