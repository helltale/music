apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-worker
  namespace: music
  labels:
    app.kubernetes.io/name: music
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: music
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/helltale/music-worker:git-unset
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: music
            - secretRef:
                name: music
          env:
            - name: TMPDIR
              value: /tmp/music-audio
          volumeMounts:
            - name: audio-tmp
              mountPath: /tmp/music-audio
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: audio-tmp
          emptyDir:
            sizeLimit: 1Gi
