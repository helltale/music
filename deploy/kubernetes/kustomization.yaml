apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - worker-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - job-migrate.yaml
replicas:
  - name: music-api
    count: 2
  - name: music-worker
    count: 2
  - name: music-web
    count: 2
components:
  - components/images
