apiVersion: batch/v1
kind: Job
metadata:
  name: music-migrate
  namespace: music
  labels:
    app.kubernetes.io/name: music
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/helltale/music-api:git-unset
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: music
            - secretRef:
                name: music
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
